<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MasterBook</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#viewer {
  position: fixed;
  inset: 0;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
}
#viewer.grabbing { cursor: grabbing; }

.pg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  will-change: transform;
  -webkit-user-drag: none;
  pointer-events: none;
  display: block;
}

/* Subtle page counter — fades in on nav, out after 1.8 s */
#badge {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  padding: 5px 14px;
  border-radius: 20px;
  background: rgba(0, 0, 0, 0.45);
  color: rgba(255, 255, 255, 0.75);
  font: 500 13px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  letter-spacing: 0.1em;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s;
  z-index: 10;
}
#badge.show { opacity: 1; }
</style>
</head>
<body>

<div id="viewer">
  <img id="imgA" class="pg" draggable="false" alt="" />
  <img id="imgB" class="pg" draggable="false" alt="" />
</div>
<div id="badge"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
// Put your images in the folder below, named 001.jpg, 002.jpg … (or 0001 etc.)
// Run extract_pages.py to pull images out of the old base64 HTML automatically.
const CFG = {
  folder : 'pages',   // subfolder containing images (relative to this HTML file)
  ext    : 'jpg',     // file extension: jpg | png | jpeg | webp
  pages  : 16,        // total page count — change this to match your image count
  pad    : 3          // zero-padding width: 3 → 001.jpg  |  4 → 0001.jpg
};
// ─────────────────────────────────────────────────────────────────────────────

const ANIM_MS  = 300;    // slide animation duration (ms)
const SNAP_PCT = 0.22;   // fraction of viewport width needed to commit a page turn

let cur       = 1;
let slot      = 'A';     // which <img> is showing the current page
let animating = false;

// drag state — null when idle
let drag = null;         // { startX, startY, dir:0|1|-1, prepped:bool }

// ── Helpers ───────────────────────────────────────────────────────────────────
const $      = id => document.getElementById(id);
const curEl  = () => slot === 'A' ? $('imgA') : $('imgB');
const offEl  = () => slot === 'A' ? $('imgB') : $('imgA');

function pageUrl(n) {
  return CFG.folder + '/' + String(n).padStart(CFG.pad, '0') + '.' + CFG.ext;
}

// ── Page counter badge ────────────────────────────────────────────────────────
let badgeTimer;
function showBadge() {
  const b = $('badge');
  b.textContent = cur + ' / ' + CFG.pages;
  b.classList.add('show');
  clearTimeout(badgeTimer);
  badgeTimer = setTimeout(function() { b.classList.remove('show'); }, 1800);
}

// ── Slot helper ───────────────────────────────────────────────────────────────
function setSlot(el, n) {
  if (el.dataset.n !== String(n)) {
    el.src = pageUrl(n);
    el.dataset.n = String(n);
  }
}

// Park the off-slot with the next page preloaded, ready on the right
function parkOff() {
  const off  = offEl();
  const next = cur + 1;
  off.style.transition = 'none';
  if (next <= CFG.pages) setSlot(off, next);
  off.style.transform = 'translateX(' + window.innerWidth + 'px)';
}

// ── Core animation ────────────────────────────────────────────────────────────
// dir: +1 = forward (slide left), -1 = backward (slide right)
// Both images must already be in their starting positions before calling.
function runAnim(dir) {
  var vw   = window.innerWidth;
  var out  = curEl();
  var inn  = offEl();
  var ease = 'transform ' + ANIM_MS + 'ms cubic-bezier(0.42, 0, 0.18, 1)';

  out.style.transition = ease;
  inn.style.transition = ease;
  out.style.transform  = dir > 0 ? 'translateX(-' + vw + 'px)' : 'translateX(' + vw + 'px)';
  inn.style.transform  = 'translateX(0)';

  slot = slot === 'A' ? 'B' : 'A';
  cur += dir;
  showBadge();
  try { localStorage.setItem('mb_page', String(cur)); } catch(e) {}
  history.replaceState(null, '', '#p=' + cur);

  setTimeout(function() {
    out.style.transition = 'none';
    out.style.transform  = 'translateX(' + window.innerWidth + 'px)';
    animating = false;
    parkOff();
  }, ANIM_MS);
}

// ── Programmatic navigate (arrow keys, etc.) ──────────────────────────────────
function navigate(dir) {
  if (animating) return;
  var next = cur + dir;
  if (next < 1 || next > CFG.pages) return;
  animating = true;

  var vw  = window.innerWidth;
  var inn = offEl();
  inn.style.transition = 'none';
  setSlot(inn, next);
  inn.style.transform = dir > 0 ? 'translateX(' + vw + 'px)' : 'translateX(-' + vw + 'px)';
  inn.getBoundingClientRect(); // force reflow so transition applies from this position
  runAnim(dir);
}

// Direct jump (Home / End) — instant, no animation
function jumpTo(n) {
  if (animating || n === cur) return;
  n = Math.max(1, Math.min(CFG.pages, n));
  setSlot(curEl(), n);
  cur = n;
  curEl().style.transform = 'translateX(0)';
  showBadge();
  try { localStorage.setItem('mb_page', String(cur)); } catch(e) {}
  history.replaceState(null, '', '#p=' + cur);
  parkOff();
}

// ── Drag / Swipe ──────────────────────────────────────────────────────────────
function dragStart(x, y) {
  if (animating) return;
  drag = { startX: x, startY: y, dir: 0, prepped: false };
  $('viewer').classList.add('grabbing');
}

function dragMove(x, y) {
  if (!drag) return;
  var dx = x - drag.startX;
  var dy = y - drag.startY;

  // Abort on clearly vertical swipe before we commit to horizontal
  if (!drag.prepped && Math.abs(dy) > Math.abs(dx) * 1.6 && Math.abs(dy) > 8) {
    drag = null;
    $('viewer').classList.remove('grabbing');
    return;
  }

  // Latch direction on first significant horizontal movement
  if (!drag.prepped && Math.abs(dx) > 6) {
    drag.dir    = dx < 0 ? 1 : -1;
    drag.prepped = true;

    var next = cur + drag.dir;
    var off  = offEl();
    var vw   = window.innerWidth;
    off.style.transition = 'none';
    if (next >= 1 && next <= CFG.pages) {
      setSlot(off, next);
      off.style.transform = drag.dir > 0
        ? 'translateX(' + vw + 'px)'
        : 'translateX(-' + vw + 'px)';
    }
  }

  if (!drag.prepped) return;

  var vw_   = window.innerWidth;
  var next_ = cur + drag.dir;

  curEl().style.transition = 'none';
  curEl().style.transform  = 'translateX(' + dx + 'px)';

  if (next_ >= 1 && next_ <= CFG.pages) {
    var base = drag.dir > 0 ? vw_ : -vw_;
    offEl().style.transition = 'none';
    offEl().style.transform  = 'translateX(' + (base + dx) + 'px)';
  }
}

function dragEnd(x) {
  if (!drag) return;
  var saved = drag;
  drag = null;
  $('viewer').classList.remove('grabbing');

  if (!saved.prepped) return;

  var dx   = x - saved.startX;
  var vw   = window.innerWidth;
  var next = cur + saved.dir;

  if (Math.abs(dx) >= vw * SNAP_PCT && next >= 1 && next <= CFG.pages) {
    // Commit — images already at intermediate positions; just complete the slide
    animating = true;
    runAnim(saved.dir);
  } else {
    // Spring back to original position
    animating = true;
    var ms   = Math.round(ANIM_MS * 0.55);
    var ease = 'transform ' + ms + 'ms cubic-bezier(0.42, 0, 0.18, 1)';
    curEl().style.transition = ease;
    curEl().style.transform  = 'translateX(0)';
    offEl().style.transition = ease;
    offEl().style.transform  = saved.dir > 0
      ? 'translateX(' + vw + 'px)'
      : 'translateX(-' + vw + 'px)';
    setTimeout(function() { animating = false; }, ms);
  }
}

// ── Mouse ─────────────────────────────────────────────────────────────────────
$('viewer').addEventListener('mousedown', function(e) {
  e.preventDefault();
  dragStart(e.clientX, e.clientY);
});
window.addEventListener('mousemove', function(e) { if (drag) dragMove(e.clientX, e.clientY); });
window.addEventListener('mouseup',   function(e) { if (drag) dragEnd(e.clientX); });

// ── Touch ─────────────────────────────────────────────────────────────────────
$('viewer').addEventListener('touchstart', function(e) {
  if (e.touches.length === 1) dragStart(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

$('viewer').addEventListener('touchmove', function(e) {
  if (!drag || e.touches.length !== 1) return;
  var t  = e.touches[0];
  var dx = Math.abs(t.clientX - drag.startX);
  var dy = Math.abs(t.clientY - drag.startY);
  if (dx > dy) e.preventDefault(); // block vertical scroll when dragging horizontally
  dragMove(t.clientX, t.clientY);
}, { passive: false });

$('viewer').addEventListener('touchend', function(e) {
  if (drag && e.changedTouches.length) dragEnd(e.changedTouches[0].clientX);
}, { passive: true });

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); navigate(1); }
  else if (e.key === 'ArrowLeft') navigate(-1);
  else if (e.key === 'Home') jumpTo(1);
  else if (e.key === 'End') jumpTo(CFG.pages);
  else if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    else document.exitFullscreen && document.exitFullscreen();
  }
});

// ── Init ──────────────────────────────────────────────────────────────────────
(function init() {
  var startPage = 1;
  var hashMatch = window.location.hash.match(/#p=(\d+)/);
  if (hashMatch) {
    startPage = parseInt(hashMatch[1]);
  } else {
    try { var s = localStorage.getItem('mb_page'); if (s) startPage = parseInt(s); } catch(e) {}
  }
  startPage = Math.max(1, Math.min(CFG.pages, startPage));
  cur = startPage;

  var on  = curEl();
  var off = offEl();
  on.style.transform  = 'translateX(0)';
  off.style.transform = 'translateX(' + window.innerWidth + 'px)';
  setSlot(on, cur);
  showBadge();
  parkOff();
})();
</script>
</body>
</html>
